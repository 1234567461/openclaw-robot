[project]
name = "openclaw-robot"
version = "0.1.0"
description = "自托管 AI 机器人框架：IM 渠道 + 物理机器人 + Minecraft 玩家 bot"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "1234567461"}]
dependencies = [
    "openai>=1.40",          # LLM provider（OpenAI 兼容）
    "httpx>=0.27",           # HTTP 客户端
    "pydantic>=2.7",         # 数据模型
    "quarry>=1.6",           # 纯 Python Minecraft 协议库
    "cryptography>=43",      # 飞书加解密依赖
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21"]
feishu = ["lark-oapi>=1.4"]
unitree = ["cycle>=0.4"]   # Unitree SDK 封装
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[project.scripts]
openclaw-mc = "openclaw_robot.minecraft.bot:main"
openclaw-gateway = "openclaw_robot.core.gateway:main"
openclaw-web = "openclaw_robot.channels.web:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_robot"]
