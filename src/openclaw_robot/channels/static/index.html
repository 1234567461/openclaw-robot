<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>openclaw-robot 聊天</title>
  <style>
    :root {
      --bg: #1a1a2e; --surface: #16213e; --bubble-bot: #0f3460; --bubble-user: #533483;
      --text: #e0e0e0; --accent: #e94560; --input-bg: #0a0a1a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--surface); padding: 12px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2a2a4a; }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
    header .dot.off { background: #ef4444; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .status { font-size: 12px; color: #888; margin-left: auto; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; line-height: 1.5; font-size: 14px; }
    .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; background: transparent; color: #666; font-size: 12px; }
    #input-bar { background: var(--surface); padding: 12px 16px; display: flex; gap: 10px; border-top: 1px solid #2a2a4a; }
    #input { flex: 1; background: var(--input-bg); border: 1px solid #333; border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
    #input:focus { border-color: var(--accent); }
    #send { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; transition: opacity .2s; }
    #send:hover { opacity: .85; }
    #send:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>openclaw-robot</h1>
    <span class="status" id="status">连接中...</span>
  </header>
  <div id="chat"></div>
  <div id="input-bar">
    <input id="input" placeholder="输入消息..." autocomplete="off" disabled>
    <button id="send" disabled>发送</button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const dot = document.getElementById('dot');
    const status = document.getElementById('status');

    let ws = null;

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        dot.classList.remove('off');
        status.textContent = '已连接';
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      };
      ws.onmessage = (e) => addMsg(e.data, 'bot');
      ws.onclose = () => {
        dot.classList.add('off');
        status.textContent = '已断开';
        input.disabled = true;
        sendBtn.disabled = true;
        addMsg('连接断开，3秒后重连...', 'system');
        setTimeout(connect, 3000);
      };
      ws.onerror = () => ws.close();
    }

    function send() {
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== 1) return;
      addMsg(text, 'user');
      ws.send(text);
      input.value = '';
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    connect();
  </script>
</body>
</html>
